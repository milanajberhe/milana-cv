name: Build CV PDF

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex

      - name: Rename PDF
        run: mv cv.pdf Milana_Berhe_CV.pdf

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Milana_Berhe_CV.pdf
          git diff --cached --quiet || git commit -m "Update CV PDF"
          git push
